name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 deploy-pages action 写 Pages + 创建部署
permissions:
  contents: read
  pages: write
  id-token: write

# 不要让其他 deploy-pages 并发跑（保护部署原子性）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉全 history，jekyll 插件可能用

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v4
        with:
          source: .
          destination: ./_site
          enable_future: false
          # Jekyll 排除 tools/ 目录（不是 jekyll 内容）
          # 用 _config.yml 的 exclude 字段

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
