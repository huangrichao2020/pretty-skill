name: Auto-deploy placeholder skill PR

on:
  pull_request:
    types: [opened, synchronize, labeled, edited]
    paths:
      - 'tools/**'

# 写 PR 评论需要
permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  validate-and-merge:
    if: |
      contains(github.event.pull_request.labels.*.name, 'auto-deploy-placeholder') &&
      contains(github.event.pull_request.labels.*.name, 'skill-status:placeholder')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr

      - name: Find changed skill path
        id: detect
        working-directory: pr
        run: |
          # 找 PR 修改的 tools/<name>/ 路径
          SKILL_PATH=$(git diff --name-only origin/main...HEAD -- 'tools/*/web.html' | head -1 | xargs -I {} dirname {} | xargs -I {} dirname {})
          if [ -z "$SKILL_PATH" ]; then
            echo "❌ 没找到 tools/<name>/web.html 改动"
            exit 1
          fi
          echo "skill_path=$SKILL_PATH" >> "$GITHUB_OUTPUT"
          SKILL_NAME=$(basename "$SKILL_PATH")
          echo "skill_name=$SKILL_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate placeholder content
        working-directory: pr
        run: |
          set -euo pipefail
          SKILL_PATH="${{ steps.detect.outputs.skill_path }}"
          SKILL_NAME="${{ steps.detect.outputs.skill_name }}"

          # 校验 1: web.html 存在
          if [ ! -f "$SKILL_PATH/web.html" ]; then
            echo "❌ 缺 $SKILL_PATH/web.html"
            exit 1
          fi
          echo "✅ web.html 存在"

          # 校验 2: manifest.yaml 存在
          if [ ! -f "$SKILL_PATH/manifest.yaml" ]; then
            echo "❌ 缺 $SKILL_PATH/manifest.yaml"
            exit 1
          fi
          echo "✅ manifest.yaml 存在"

          # 校验 3: SKILL.md 存在
          if [ ! -f "$SKILL_PATH/SKILL.md" ]; then
            echo "❌ 缺 $SKILL_PATH/SKILL.md"
            exit 1
          fi
          echo "✅ SKILL.md 存在"

          # 校验 4: title ≥ 5 字（从 manifest.yaml 取）
          TITLE=$(grep -E '^name:' "$SKILL_PATH/manifest.yaml" | head -1 | sed -E 's/^name:[[:space:]]+//' | tr -d '"')
          TITLE_LEN=${#TITLE}
          if [ "$TITLE_LEN" -lt 2 ]; then
            echo "❌ name 太短 ($TITLE_LEN 字符)，至少 2 字符"
            exit 1
          fi
          echo "✅ name OK: $TITLE ($TITLE_LEN 字符)"

          # 校验 5: description ≥ 100 字（从 manifest.yaml 取多行）
          DESC=$(awk '
            /^description:/ { flag=1; sub(/^description:[[:space:]]*[|>+-]?[[:space:]]*/, ""); if (length($0)>0) print; next }
            flag && /^[[:space:]]/ { print; next }
            flag { flag=0 }
          ' "$SKILL_PATH/manifest.yaml" | tr -d '\n' | sed 's/  */ /g')
          DESC_LEN=${#DESC}
          if [ "$DESC_LEN" -lt 100 ]; then
            echo "❌ description 太短 ($DESC_LEN 字符)，至少 100 字符"
            exit 1
          fi
          echo "✅ description OK: $DESC_LEN 字符"

          # 校验 6: 触发词 ≥ 3 个
          TRIGGERS=$(awk '/^triggers:/{flag=1;next}/^[a-zA-Z]/{flag=0}flag' "$SKILL_PATH/manifest.yaml" | grep -E '^[[:space:]]+-[[:space:]]+' | wc -l | tr -d ' ')
          if [ "$TRIGGERS" -lt 3 ]; then
            echo "❌ triggers 太少 ($TRIGGERS 个)，至少 3 个"
            exit 1
          fi
          echo "✅ triggers OK: $TRIGGERS 个"

          # 校验 7: web.html 里有图（image 风格需要）/或纯文字 OK
          if [ -f "$SKILL_PATH/web.html" ]; then
            IMG_COUNT=$(grep -cE '<img|<svg' "$SKILL_PATH/web.html" || true)
            if [ "$IMG_COUNT" -lt 1 ]; then
              echo "⚠️  web.html 没有 <img> 或 <svg>（占位版可接受）"
            else
              echo "✅ web.html 有 $IMG_COUNT 个 <img>/<svg>"
            fi
          fi

          # 把验证结果写到 outputs（给下一步用）
          echo "skill_name=$SKILL_NAME" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const skillName = '${{ steps.detect.outputs.skill_name }}';
            const body = [
              '## ✅ 占位 PR 校验通过',
              '',
              `Skill: **${skillName}**`,
              '所有占位特征校验通过（web.html + manifest.yaml + SKILL.md + name + description + triggers）。',
              '',
              '### 下一步',
              '1. 这个 PR 会被自动 merge（auto-merge 开启后）',
              '2. 合并后 deploy-pages.yml 会自动部署 GitHub Pages',
              '3. 你拿到的 URL：`https://huangrichao2020.github.io/pretty-skills/tools/' + skillName + '/web.html`',
              '',
              '### 后续补完整版',
              '占位版上线后，你可以提另一个 PR 把 web.html 升级为完整版（加 .md / .pptx / 锦绣 4 形态）。',
              '',
              '---\n🤖 Mavis auto-deploy'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.enableAutoMerge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            });
            console.log('✅ auto-merge enabled');

      - name: Approve PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '✅ Auto-approved by Mavis auto-deploy workflow（占位特征全部通过校验）'
            });
            console.log('✅ PR approved');
