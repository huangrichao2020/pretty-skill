<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏观数据监控 · 面向 A 股的每日宏观早报 · PPT 演示版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #000; color: #fff; user-select: none;
}

/* ===== 主舞台 ===== */
.app { display: flex; width: 100vw; height: 100vh; }
.sidebar {
  width: 180px; height: 100%; background: rgba(26, 26, 26, 0.92);
  border-right: 1px solid #333; padding: 12px 8px; overflow-y: auto;
  transition: transform 0.3s ease;
}
.sidebar.hidden { transform: translateX(-100%); }
.sidebar h3 {
  font-size: 11px; color: #aaa; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 12px; padding: 0 4px;
}
.thumb {
  width: 100%; aspect-ratio: 16/9; background: #0a0a0a;
  border-radius: 4px; margin-bottom: 8px; cursor: pointer;
  border: 2px solid transparent; transition: all 0.15s; overflow: hidden;
  position: relative;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.active { border-color: #00d4aa; box-shadow: 0 0 12px rgba(0, 212, 170, 0.4); }
.thumb .thumb-num {
  position: absolute; top: 4px; left: 4px;
  background: rgba(0, 0, 0, 0.7); color: #00d4aa;
  font-size: 10px; padding: 1px 6px; border-radius: 8px;
}

.stage { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
.slide { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; }
.slide.active { display: flex; }
.slide img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* ===== 顶部标题栏 ===== */
.overlay-top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 24px; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
.overlay-top .title { font-size: 14px; color: #fff; font-weight: 500; }
.overlay-top .progress { font-size: 12px; color: #00d4aa; font-weight: 600; }

/* ===== 底部翻页控制 ===== */
.controls {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 12px 24px; background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
  display: flex; justify-content: space-between; align-items: center;
}
.controls button {
  background: rgba(255, 255, 255, 0.1); color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 6px 14px; border-radius: 4px; font-size: 12px;
  cursor: pointer; transition: all 0.15s; pointer-events: auto;
}
.controls button:hover { background: rgba(0, 212, 170, 0.2); border-color: #00d4aa; }
.controls .key-hint { font-size: 11px; color: #888; }

/* ===== 演讲者模式 ===== */
.presenter-mode {
  position: fixed; inset: 0; background: #0a0a0a;
  display: none; z-index: 9999; padding: 24px;
  grid-template-columns: 2fr 1fr; grid-template-rows: 2fr 1fr; gap: 16px;
}
.presenter-mode.active { display: grid; }
.pm-current, pm-next, pm-notes, pm-timer {
  background: #1a1a1a; border-radius: 8px; padding: 16px; overflow: hidden;
}
.pm-current { grid-column: 1; grid-row: 1; border: 2px solid #00d4aa; }
.pm-current img { width: 100%; height: 100%; object-fit: contain; }
.pm-next { grid-column: 2; grid-row: 1; }
.pm-next img { width: 100%; height: 100%; object-fit: contain; opacity: 0.6; }
.pm-notes { grid-column: 1; grid-row: 2; overflow-y: auto; }
.pm-notes h4 { color: #00d4aa; font-size: 13px; margin-bottom: 8px; }
.pm-notes p { color: #ddd; font-size: 12px; line-height: 1.6; }
.pm-timer { grid-column: 2; grid-row: 2; text-align: center; }
.pm-timer .clock { font-size: 32px; color: #00d4aa; font-family: 'SF Mono', monospace; margin: 12px 0; }
.pm-timer .label { font-size: 11px; color: #888; }
.pm-label { font-size: 11px; color: #888; margin-bottom: 6px; }

/* ===== 黑/白屏 ===== */
.blackout, .whiteout {
  position: fixed; inset: 0; display: none; z-index: 9998; cursor: pointer;
  align-items: center; justify-content: center; font-size: 24px;
}
.blackout.active { display: flex; background: #000; }
.whiteout.active { display: flex; background: #fff; color: #000; }

/* ===== 备注覆盖层 ===== */
.note-overlay {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  max-width: 80%; background: rgba(0, 0, 0, 0.85); color: #ddd;
  padding: 12px 20px; border-radius: 6px; font-size: 13px; line-height: 1.6;
  display: none; z-index: 9997; max-height: 30vh; overflow-y: auto;
}
.note-overlay.active { display: block; }

/* ===== 首次访问键盘提示 ===== */
.keyboard-hint {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.92); border: 1px solid #00d4aa;
  padding: 24px 32px; border-radius: 8px; z-index: 10000;
  max-width: 480px; text-align: center;
}
.keyboard-hint h3 { color: #00d4aa; margin-bottom: 12px; font-size: 16px; }
.keyboard-hint .keys { color: #fff; font-size: 13px; line-height: 2; }
.keyboard-hint kbd {
  display: inline-block; background: #333; padding: 2px 8px; border-radius: 3px;
  font-family: monospace; font-size: 11px; margin: 0 2px;
}
.keyboard-hint button { margin-top: 12px; }

/* 移动端隐藏侧栏 */
@media (max-width: 768px) {
  .sidebar { position: fixed; z-index: 100; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <h3>缩略图导航</h3>
        <div class="thumb" data-idx="0"><img src="images/p0.png" alt="P0"><span class="thumb-num">1</span></div>
    <div class="thumb" data-idx="1"><img src="images/p1.png" alt="P1"><span class="thumb-num">2</span></div>
    <div class="thumb" data-idx="2"><img src="images/p2.png" alt="P2"><span class="thumb-num">3</span></div>
    <div class="thumb" data-idx="3"><img src="images/p3.png" alt="P3"><span class="thumb-num">4</span></div>
    <div class="thumb" data-idx="4"><img src="images/p4.png" alt="P4"><span class="thumb-num">5</span></div>
    <div class="thumb" data-idx="5"><img src="images/p5.png" alt="P5"><span class="thumb-num">6</span></div>
    <div class="thumb" data-idx="6"><img src="images/p6.png" alt="P6"><span class="thumb-num">7</span></div>
  </aside>

  <main class="stage">
    <div class="slide" data-idx="0"><img src="images/p0.png" alt="P0"></div>
    <div class="slide" data-idx="1"><img src="images/p1.png" alt="P1"></div>
    <div class="slide" data-idx="2"><img src="images/p2.png" alt="P2"></div>
    <div class="slide" data-idx="3"><img src="images/p3.png" alt="P3"></div>
    <div class="slide" data-idx="4"><img src="images/p4.png" alt="P4"></div>
    <div class="slide" data-idx="5"><img src="images/p5.png" alt="P5"></div>
    <div class="slide" data-idx="6"><img src="images/p6.png" alt="P6"></div>
    <div class="overlay-top">
      <div class="title">宏观数据监控 · 面向 A 股的每日宏观早报</div>
      <div class="progress"><span id="current">1</span> / <span id="total">7</span></div>
    </div>
    <div class="controls">
      <div>
        <button onclick="goPrev()">◀ 上页</button>
        <button onclick="goNext()">下页 ▶</button>
        <button onclick="goHome()">首页</button>
        <button onclick="goEnd()">末页</button>
      </div>
      <div class="key-hint">
        ← → 翻页 · F 全屏 · S 演讲者模式 · B 黑屏 · W 白屏 · N 备注 · T 缩略图
      </div>
      <div>
        <button onclick="togglePresenter()">🎤 演讲者</button>
        <button onclick="toggleFullscreen()">⛶ 全屏</button>
        <button onclick="toggleSidebar()">⊟ 侧栏</button>
      </div>
    </div>
  </main>
</div>

<!-- 演讲者模式 -->
<div class="presenter-mode" id="presenterMode">
  <div class="pm-current">
    <div class="pm-label">当前页 <span id="pm-cur-num">1</span> / <span id="pm-total">7</span></div>
    <img id="pm-cur-img" src="" alt="">
  </div>
  <div class="pm-next">
    <div class="pm-label">下一页</div>
    <img id="pm-next-img" src="" alt="">
  </div>
  <div class="pm-notes">
    <h4>📝 演讲备注</h4>
    <p id="pm-notes-content">宏观数据监控 · 面向 A 股的每日宏观早报 · pretty-skills PPT 演示版</p>
  </div>
  <div class="pm-timer">
    <div class="label">⏱ 已演讲时长</div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="label">按 R 重置</div>
  </div>
</div>

<!-- 黑/白屏 -->
<div class="blackout" id="blackout" onclick="toggleBlack()"></div>
<div class="whiteout" id="whiteout" onclick="toggleWhite()">按 W 恢复</div>

<!-- 备注覆盖 -->
<div class="note-overlay" id="noteOverlay"></div>

<!-- 键盘提示 -->
<div class="keyboard-hint" id="keyboardHint">
  <h3>⌨️ 键盘快捷键</h3>
  <div class="keys">
    <kbd>←</kbd> <kbd>→</kbd> <kbd>Space</kbd> 翻页 · <kbd>F11</kbd> <kbd>F</kbd> 全屏<br>
    <kbd>S</kbd> <kbd>P</kbd> 演讲者模式 · <kbd>B</kbd> 黑屏 · <kbd>W</kbd> 白屏<br>
    <kbd>N</kbd> 备注 · <kbd>T</kbd> 缩略图 · <kbd>Home</kbd> <kbd>End</kbd> 首末页
  </div>
  <button onclick="dismissHint()">知道了</button>
</div>

<script>
// ===== 配置 =====
const PAGE_COUNT = 7;
const PAGE_IMAGES = ['p0.png', 'p1.png', 'p2.png', 'p3.png', 'p4.png', 'p5.png', 'p6.png'];
const PAGE_NOTES = ['第 1 页 · p0', '第 2 页 · p1', '第 3 页 · p2', '第 4 页 · p3', '第 5 页 · p4', '第 6 页 · p5', '第 7 页 · p6'];
const DEFAULT_NOTE = "宏观数据监控 · 面向 A 股的每日宏观早报 · pretty-skills PPT 演示版";

let cur = 0;
let timerStart = Date.now();
let hintDismissed = sessionStorage.getItem('ppt-hint-dismissed') === '1';

// ===== 基础函数 =====
function showPage(n) {
  cur = Math.max(0, Math.min(PAGE_COUNT - 1, n));
  document.querySelectorAll('.slide').forEach((s, i) => {
    s.classList.toggle('active', i === cur);
  });
  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === cur);
  });
  document.getElementById('current').textContent = cur + 1;
  // 演讲者模式
  document.getElementById('pm-cur-num').textContent = cur + 1;
  document.getElementById('pm-cur-img').src = PAGE_IMAGES[cur];
  document.getElementById('pm-next-img').src = PAGE_IMAGES[Math.min(cur + 1, PAGE_COUNT - 1)];
  document.getElementById('pm-notes-content').textContent = PAGE_NOTES[cur] || DEFAULT_NOTE;
  document.getElementById('noteOverlay').textContent = PAGE_NOTES[cur] || '';
  // 自动滚动缩略图
  const activeThumb = document.querySelector('.thumb.active');
  if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function goNext() { showPage(cur + 1); }
function goPrev() { showPage(cur - 1); }
function goHome() { showPage(0); }
function goEnd() { showPage(PAGE_COUNT - 1); }

// ===== 键盘事件 =====
document.addEventListener('keydown', (e) => {
  // 忽略输入框
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch(e.key) {
    case 'ArrowRight': case ' ': case 'PageDown':
      e.preventDefault(); goNext(); break;
    case 'ArrowLeft': case 'PageUp':
      e.preventDefault(); goPrev(); break;
    case 'Home': e.preventDefault(); goHome(); break;
    case 'End': e.preventDefault(); goEnd(); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 's': case 'S': case 'p': case 'P': togglePresenter(); break;
    case 'b': case 'B': toggleBlack(); break;
    case 'w': case 'W': toggleWhite(); break;
    case 'n': case 'N': toggleNote(); break;
    case 't': case 'T': toggleSidebar(); break;
    case 'r': case 'R': if (document.getElementById('presenterMode').classList.contains('active')) { timerStart = Date.now(); } break;
    case 'Escape':
      // 关闭所有覆盖层
      document.getElementById('presenterMode').classList.remove('active');
      document.getElementById('blackout').classList.remove('active');
      document.getElementById('whiteout').classList.remove('active');
      document.getElementById('noteOverlay').classList.remove('active');
      break;
  }
});

// 鼠标点击翻页（左半上一页，右半下一页）
document.querySelector('.stage').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'IMG') return;
  const rect = e.currentTarget.getBoundingClientRect();
  if (e.clientX < rect.width / 2) goPrev();
  else goNext();
});

// ===== 模式切换 =====
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
function togglePresenter() {
  document.getElementById('presenterMode').classList.toggle('active');
}
function toggleBlack() {
  document.getElementById('blackout').classList.toggle('active');
  if (document.getElementById('blackout').classList.contains('active')) {
    document.getElementById('whiteout').classList.remove('active');
  }
}
function toggleWhite() {
  document.getElementById('whiteout').classList.toggle('active');
  if (document.getElementById('whiteout').classList.contains('active')) {
    document.getElementById('blackout').classList.remove('active');
  }
}
function toggleNote() {
  const n = document.getElementById('noteOverlay');
  n.classList.toggle('active');
  if (n.classList.contains('active')) {
    setTimeout(() => n.classList.remove('active'), 5000);
  }
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('hidden');
}

// 缩略图点击
document.querySelectorAll('.thumb').forEach((t) => {
  t.addEventListener('click', () => {
    showPage(parseInt(t.dataset.idx));
  });
});

// 计时器
setInterval(() => {
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}, 1000);

// 键盘提示
function dismissHint() {
  document.getElementById('keyboardHint').style.display = 'none';
  sessionStorage.setItem('ppt-hint-dismissed', '1');
}
if (hintDismissed) {
  document.getElementById('keyboardHint').style.display = 'none';
}

// 初始化
showPage(0);
</script>
</body>
</html>
