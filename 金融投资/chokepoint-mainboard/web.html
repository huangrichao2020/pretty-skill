<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{PPT 标题}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;background:#0D1117}
#app{display:flex;height:100vh}
#sidebar{width:160px;overflow-y:auto;padding:12px 8px;border-right:1px solid #30363d;background:#161B22}
#sidebar img{width:100%;border-radius:4px;margin-bottom:8px;cursor:pointer;border:2px solid transparent;transition:.15s}
#sidebar img.active{border-color:#00d4aa}
#main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
#main img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.page-num{text-align:center;font-size:12px;color:#8b949e;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main"><div><img id="view" alt=""><div class="page-num" id="pnum"></div></div></div>
</div>
<script>
// ===== 配置区 =====
const pages = ["p0_cover","p1_hook","p2_mains","p3_detail","p4_detail2","p5_counter","p6_closing"];
// =================
let cur = 0;
function load(p) {
  document.getElementById("view").src = `images/${pages[p]}.png`;
  document.getElementById("pnum").textContent = `${p + 1} / ${pages.length}`;
  document.querySelectorAll("#sidebar img").forEach((el, i) => el.classList.toggle("active", i === p));
}
pages.forEach((f, i) => {
  const img = document.createElement("img");
  img.src = `images/${f}.png`;
  img.onclick = () => { cur = i; load(cur); };
  document.getElementById("sidebar").appendChild(img);
});
load(0);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" && cur < pages.length - 1) { cur++; load(cur); }
  if (e.key === "ArrowLeft" && cur > 0) { cur--; load(cur); }
});
</script>
</body>
</html>
