<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{ title }} · 占位版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>{% raw %}
  /* 瑞士风 · 自托管字体优先 + 系统字体兜底
     参考：dashiAI swiss theme + classic 瑞士设计
     特点：大字、网格、黑白、留白
  */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: "Archivo Local";
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: local("Archivo"), local("Archivo Regular");
  }
  @font-face {
    font-family: "Archivo Local";
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: local("Archivo Black"), local("Archivo Bold");
  }

  body {
    font-family: "Archivo Local", "Helvetica Neue", "Arial", "PingFang SC", "SF Pro CJK", sans-serif;
    background: #fafaf7;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶栏 — 跟 dashiAI 顶栏类似的"控制台"风格 */
  .topbar {
    border-bottom: 1px solid #1a1a1a;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar-dot {
    width: 8px; height: 8px; background: #1a1a1a; border-radius: 50%;
  }
  .topbar-title {
    font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  }
  .topbar-status {
    font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
    padding: 4px 10px; background: #fef3c7; color: #92400e; border: 1px solid #1a1a1a;
  }
  .topbar-status.complete { background: #d1fae5; color: #065f46; }

  /* 主区 — 12 栏瑞士网格 */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 64px 32px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 32px;
  }

  .cover {
    grid-column: 1 / -1;
    aspect-ratio: 16 / 7;
    background: #1a1a1a;
    color: #fafaf7;
    display: flex;
    align-items: flex-end;
    padding: 48px;
    position: relative;
    overflow: hidden;
  }
  .cover-num {
    position: absolute;
    top: 32px;
    left: 32px;
    font-size: 96px;
    font-weight: 700;
    line-height: 1;
    color: #fafaf7;
    opacity: 0.15;
  }
  .cover-text {
    position: relative;
    z-index: 1;
  }
  .cover-domain {
    font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 12px; color: #fafaf7;
  }
  .cover-title {
    font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -1.5px;
  }

  /* 描述区 */
  .description {
    grid-column: 1 / 8;
    font-size: 22px;
    line-height: 1.45;
    color: #1a1a1a;
    border-top: 1px solid #1a1a1a;
    padding-top: 24px;
  }

  /* meta sidebar */
  .meta {
    grid-column: 9 / -1;
    border-top: 1px solid #1a1a1a;
    padding-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    font-size: 13px;
  }
  .meta-row { display: grid; grid-template-columns: 100px 1fr; gap: 12px; }
  .meta-key {
    font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: #6b6b6b; font-size: 11px;
  }
  .meta-val { color: #1a1a1a; }

  /* triggers */
  .triggers { display: flex; flex-direction: column; gap: 4px; }
  .triggers span {
    background: #1a1a1a; color: #fafaf7;
    padding: 4px 8px;
    font-size: 11px;
    font-family: "JetBrains Mono", "SF Mono", "Menlo", monospace;
    display: inline-block;
    width: fit-content;
  }

  /* 底部信息 */
  .footer {
    grid-column: 1 / -1;
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid #1a1a1a;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #6b6b6b;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .footer-hint {
    color: #92400e;
  }
  .footer-hint.complete { color: #065f46; }
{% endraw %}</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-dot"></span>
    <span class="topbar-title">pretty-skill · placeholder</span>
  </div>
  <span class="topbar-status {{ status_class }}">{{ status_badge }}</span>
</header>

<main>
  <section class="cover">
    <div class="cover-num">01</div>
    <div class="cover-text">
      <div class="cover-domain">{{ domain }}</div>
      <h1 class="cover-title">{{ title }}</h1>
    </div>
  </section>

  <article class="description">
    {{ description }}
  </article>

  <aside class="meta">
    <div class="meta-row">
      <span class="meta-key">author</span>
      <span class="meta-val">{{ contributor }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-key">domain</span>
      <span class="meta-val">{{ domain }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-key">triggers</span>
      <div class="meta-val">
        <div class="triggers">{{ trigger_html }}</div>
      </div>
    </div>
    <div class="meta-row">
      <span class="meta-key">related</span>
      <span class="meta-val">{{ related }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-key">created</span>
      <span class="meta-val">{{ created }}</span>
    </div>
  </aside>

  <div class="footer">
    <span>pretty-skill · 3F Content + 锦绣</span>
    <span class="footer-hint {{ status_class }}">{{ status_hint }}</span>
  </div>
</main>
</body>
</html>
