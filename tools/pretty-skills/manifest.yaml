name: pretty-skills
version: 0.1.0
description: |
  跨 agent 的 skill 管理器。让每个 agent 都能装、每个用户都能改、每个贡献都被看见。
  支持 8 个子命令：list / info / add / rm / update / graph / contribute / sync。
author: huangrichao2020
license: MIT
tags:
  - agent
  - skill-manager
  - cross-platform
triggers:
  - 装 pretty-skills
  - 管 skill
  - ps list
  - ps add
  - ps update
  - ps graph
  - 贡献 skill
  - 提 PR
  - 跨 agent 同步
dependencies:
  - name: bash
    version: ">=3.2"
    optional: true
  - name: git
    version: ">=2.0"
    optional: false
  - name: gh
    version: ">=2.0"
    optional: true
  - name: python3
    version: ">=3.8"
    optional: true
agents:
  claude-code: true
  codex: true
  mavis: true
  cursor: true
  windsurf: true
entry: SKILL.md
homepage: https://github.com/huangrichao2020/pretty-skills/tree/main/tools/pretty-skills
