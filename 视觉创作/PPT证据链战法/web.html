<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT 证据链战法 · CyberPPT 三段式 PPT 演示版 v2</title>
<style>
/* === 主题色变量合同（7 套主题） === */
:root,
.theme-cyberppt {
  --accent: #4a90e2; --accent-rgb: 74, 144, 226; --accent-on: #fff;
  --bg-primary: #000; --bg-sidebar: rgba(26, 26, 26, 0.92);
  --text-primary: #fff; --text-secondary: #aaa; --border: #333;
}
.theme-feiquan {
  --accent: #497568; --accent-rgb: 73, 117, 104; --accent-on: #fff;
  --bg-primary: #0a1410; --bg-sidebar: rgba(20, 30, 26, 0.92);
  --text-primary: #f0f0f0; --text-secondary: #b8c4be; --border: #2a3a32;
}
.theme-lotus {
  --accent: #D9C6B3; --accent-rgb: 217, 198, 179; --accent-on: #0a0a0a;
  --bg-primary: #f5f0e8; --bg-sidebar: rgba(238, 230, 218, 0.92);
  --text-primary: #0a0a0a; --text-secondary: #5a4a3a; --border: #c9b8a0;
}
.theme-xiang {
  --accent: #4A76A8; --accent-rgb: 74, 118, 168; --accent-on: #fff;
  --bg-primary: #0a1422; --bg-sidebar: rgba(20, 30, 44, 0.92);
  --text-primary: #f0f0f0; --text-secondary: #b8c4d4; --border: #2a3a52;
}
.theme-crimson {
  --accent: #9E3B3B; --accent-rgb: 158, 59, 59; --accent-on: #fff;
  --bg-primary: #1a0a0a; --bg-sidebar: rgba(40, 20, 20, 0.92);
  --text-primary: #f0e8e8; --text-secondary: #c4a8a8; --border: #523030;
}
.theme-crow {
  --accent: #E6C24D; --accent-rgb: 230, 194, 77; --accent-on: #0a0a0a;
  --bg-primary: #1a160a; --bg-sidebar: rgba(40, 36, 20, 0.92);
  --text-primary: #f0e8c8; --text-secondary: #c4b88a; --border: #525030;
}
.theme-mountain {
  --accent: #B2C9B2; --accent-rgb: 178, 201, 178; --accent-on: #0a0a0a;
  --bg-primary: #0a1410; --bg-sidebar: rgba(20, 30, 26, 0.92);
  --text-primary: #f0f0f0; --text-secondary: #b8c4be; --border: #2a3a32;
}

/* === 全局样式（CSS 变量驱动） === */
* { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
html, body { width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary); color: var(--text-primary); user-select: none; }
.app { display: flex; width: 100vw; height: 100vh; }
.sidebar { width: 180px; height: 100%; background: var(--bg-sidebar);
  border-right: 1px solid var(--border); padding: 12px 8px; overflow-y: auto; transition: transform .3s; }
.sidebar.hidden { transform: translateX(-100%); }
.sidebar h3 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding: 0 4px; }
.thumb { width: 100%; aspect-ratio: 16/9; background: var(--bg-primary); border-radius: 4px; margin-bottom: 8px;
  cursor: pointer; border: 2px solid transparent; overflow: hidden; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.4); }
.thumb .thumb-num { position: absolute; top: 4px; left: 4px; background: rgba(0, 0, 0, 0.7); color: var(--accent); font-size: 10px; padding: 1px 6px; border-radius: 8px; }
.stage { flex: 1; position: relative; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; }
.slide { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; }
.slide.active { display: flex; }
.slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
.overlay-top { position: absolute; top: 0; left: 0; right: 0; padding: 12px 24px;
  background: linear-gradient(to bottom, rgba(var(--accent-rgb), 0.15), transparent); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.overlay-top .title { font-size: 14px; font-weight: 500; }
.overlay-top .progress { font-size: 12px; color: var(--accent); font-weight: 600; }

/* === 主题色切换器（v2 新增） === */
.theme-switcher { position: absolute; top: 50%; right: 24px; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; pointer-events: auto; z-index: 20; }
.theme-switcher-label { font-size: 10px; color: var(--text-secondary); text-align: center; margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: 1px; writing-mode: vertical-rl; }
.theme-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); position: relative; }
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { border-color: var(--text-primary); transform: scale(1.2);
  box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--accent), 0 4px 12px rgba(0, 0, 0, 0.4); }
.theme-dot::after { content: attr(data-name); position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
  background: var(--bg-sidebar); color: var(--text-primary); padding: 2px 8px; border-radius: 3px;
  font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.theme-dot:hover::after { opacity: 1; }

.controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 24px;
  background: linear-gradient(to top, rgba(var(--accent-rgb), 0.15), transparent); display: flex; justify-content: space-between; align-items: center; }
.controls button { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.2s; pointer-events: auto; }
.controls button:hover { background: rgba(var(--accent-rgb), 0.2); border-color: var(--accent); }
.controls .key-hint { font-size: 11px; color: var(--text-secondary); }
</style>
</head>
<body class="theme-cyberppt">
<div class="app">
  <aside class="sidebar" id="sidebar"><h3>缩略图导航</h3>
    <div class="thumb" data-idx="0"><img src="images/p0.png"><span class="thumb-num">1</span></div>
    <div class="thumb" data-idx="1"><img src="images/p1.png"><span class="thumb-num">2</span></div>
    <div class="thumb" data-idx="2"><img src="images/p2.png"><span class="thumb-num">3</span></div>
    <div class="thumb" data-idx="3"><img src="images/p3.png"><span class="thumb-num">4</span></div>
    <div class="thumb" data-idx="4"><img src="images/p4.png"><span class="thumb-num">5</span></div>
    <div class="thumb" data-idx="5"><img src="images/p5.png"><span class="thumb-num">6</span></div>
    <div class="thumb" data-idx="6"><img src="images/p6.png"><span class="thumb-num">7</span></div>
  </aside>
  <main class="stage">
    <div class="slide active" data-idx="0"><img src="images/p0.png"></div>
    <div class="slide" data-idx="1"><img src="images/p1.png"></div>
    <div class="slide" data-idx="2"><img src="images/p2.png"></div>
    <div class="slide" data-idx="3"><img src="images/p3.png"></div>
    <div class="slide" data-idx="4"><img src="images/p4.png"></div>
    <div class="slide" data-idx="5"><img src="images/p5.png"></div>
    <div class="slide" data-idx="6"><img src="images/p6.png"></div>
    <div class="overlay-top"><span class="title">PPT 证据链战法 · CyberPPT 三段式</span><span class="progress" id="prog">1 / 7</span></div>

    <!-- 主题色切换器（v2 新增） -->
    <div class="theme-switcher" id="themeSwitcher">
      <div class="theme-switcher-label">主题色</div>
      <button class="theme-dot active" data-theme="cyberppt"  data-name="CyberPPT"  style="background:#4a90e2"></button>
      <button class="theme-dot"        data-theme="feiquan"   data-name="飞泉绿"     style="background:#497568"></button>
      <button class="theme-dot"        data-theme="lotus"     data-name="藕丝秋"     style="background:#D9C6B3"></button>
      <button class="theme-dot"        data-theme="xiang"     data-name="湘蓝"       style="background:#4A76A8"></button>
      <button class="theme-dot"        data-theme="crimson"   data-name="绛缨"       style="background:#9E3B3B"></button>
      <button class="theme-dot"        data-theme="crow"      data-name="鸦黄"       style="background:#E6C24D"></button>
      <button class="theme-dot"        data-theme="mountain"  data-name="山岚"       style="background:#B2C9B2"></button>
    </div>

    <div class="controls">
      <button id="prev">← 上一页</button>
      <span class="key-hint">← / → 翻页 · S 隐藏侧栏 · T 切主题</span>
      <button id="next">下一页 →</button>
    </div>
  </main>
</div>
<script>
let idx = 0; const slides = [...document.querySelectorAll('.slide')];
const thumbs = [...document.querySelectorAll('.thumb')];
const prog = document.getElementById('prog');
function show(i){ idx = (i+slides.length)%slides.length;
  slides.forEach(s=>s.classList.toggle('active', +s.dataset.idx===idx));
  thumbs.forEach(t=>t.classList.toggle('active', +t.dataset.idx===idx));
  prog.textContent = (idx+1)+' / '+slides.length; }
document.getElementById('prev').onclick=()=>show(idx-1);
document.getElementById('next').onclick=()=>show(idx+1);
thumbs.forEach(t=>t.onclick=()=>show(+t.dataset.idx));
document.getElementById('sidebar').onclick=e=>{ if(e.target.id==='sidebar') e.currentTarget.classList.toggle('hidden'); };

/* === 主题色切换（v2 新增） === */
const THEME_KEY = 'ppt-evidence-theme';
const THEMES = ['cyberppt', 'feiquan', 'lotus', 'xiang', 'crimson', 'crow', 'mountain'];
const themeDots = [...document.querySelectorAll('.theme-dot')];
function applyTheme(t) {
  if (!THEMES.includes(t)) t = 'cyberppt';
  document.body.className = 'theme-' + t;
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
  themeDots.forEach(d => d.classList.toggle('active', d.dataset.theme === t));
  document.title = 'PPT 证据链战法 · ' + (themeDots.find(d => d.dataset.theme === t)?.dataset.name || t) + ' 三段式 PPT 演示版 v2';
}
themeDots.forEach(d => d.onclick = () => applyTheme(d.dataset.theme));
let savedTheme = 'cyberppt';
try { savedTheme = localStorage.getItem(THEME_KEY) || 'cyberppt'; } catch(e) {}
applyTheme(savedTheme);

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') show(idx-1);
  if(e.key==='ArrowRight') show(idx+1);
  if(e.key.toLowerCase()==='s') document.getElementById('sidebar').classList.toggle('hidden');
  if(e.key.toLowerCase()==='t') {
    const cur = document.body.className.replace('theme-','');
    const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    applyTheme(next);
  }
});
show(0);
</script>
</body>
</html>
