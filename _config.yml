title: "pretty-skills · 跨 agent 的 skill 管理器"
description: |
  让每个 agent 都能装、每个用户都能改、每个贡献都被看见。
  5 大 agent 一次装（Claude Code / Codex / Mavis / Cursor / Windsurf），
  边缘优先开源：本地增删改无门槛，PR 是用户主动判断。
email: huangrichao2020@users.noreply.github.com
url: "https://github.com/huangrichao2020/pretty-skills"
repository: huangrichao2020/pretty-skills

# Jekyll 配置：让 tools/ 下的文件作为静态文件提供（不 liquid 解析）
# 这样用户访问 https://.../tools/<name>/web.html 就能直接看到 skill 内容
defaults:
  - scope:
      path: "tools"
    values:
      liquid: false
      sitemap: false
      feed: false

# 排除这些（不参与 build）
exclude:
  - README.md
  - CHANGELOG.md
  - "*.yml"
  - "*.yaml"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.log"
  - ".github"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
